<style>
:root{--gold:#f0c040;--gold-dim:#c49a20;--cream:#ffffff;--cream-dim:#d8c8a8;--orange:#e07020;--bg:#0a0400;--surface:#130602;--border:#2a1206;--muted:#a07850;--brown:#1a0800;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{background:radial-gradient(80% 60% at 50% 18%,rgba(240,192,64,.13),transparent 70%),var(--bg);color:var(--cream);font-family:'Barlow',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center;}
.logo{width:min(300px,70vw);height:auto;filter:drop-shadow(0 0 26px rgba(240,192,64,.35));}
.card{position:relative;overflow:hidden;width:100%;max-width:560px;margin-top:28px;padding:28px 22px 26px;border:1px solid var(--border);border-top:2px solid var(--gold-dim);
  border-radius:0 0 8px 8px;background:linear-gradient(120deg,rgba(240,192,64,.08),var(--surface) 50%,var(--bg));box-shadow:6px 6px 0 #000;}
.wm{position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:150px;line-height:.8;color:var(--gold);opacity:.06;pointer-events:none;}
.eyebrow{position:relative;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:3px;color:var(--orange);}
h1{position:relative;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(44px,11vw,72px);line-height:.92;letter-spacing:1px;color:var(--gold);text-shadow:3px 3px 0 #000;margin-top:8px;}
.plate{width:70px;height:4px;border-radius:2px;background:var(--gold);box-shadow:0 0 14px rgba(240,192,64,.6);margin:14px auto;}
p{position:relative;font-size:16px;line-height:1.55;color:var(--cream-dim);max-width:440px;margin:0 auto;}
.btn{display:inline-block;margin-top:22px;padding:12px 20px;border:2px solid var(--orange);border-radius:6px;color:var(--orange);text-decoration:none;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;letter-spacing:1.5px;box-shadow:3px 3px 0 #000;transition:all .14s;position:relative;}
.btn:hover{background:var(--orange);color:var(--brown);transform:translate(-2px,-2px);box-shadow:5px 5px 0 #000;}
.foot{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.foot img{width:110px;height:auto;opacity:.9;}
.foot span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;color:var(--muted);}
</style>
